[workspace]
resolver = "3"
members = ["crates/zero-elo", "crates/zero-elo-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/hansl/project-zero-elo"
authors = ["Hans Larsen"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
